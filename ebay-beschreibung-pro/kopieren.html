bold;">Durchmesser</td><td style="padding:8px 12px;border-bottom:1px solid #e3e7ec;">19 mm&amp;nbsp;</td></tr><tr><td style="padding:8px 12px;border-bottom:1px solid #e3e7ec;background:#f4f6f8;width:38%;font-weight:bold;">Zustand</td><td style="padding:8px 12px;border-bottom:1px solid #e3e7ec;">Neu</td></tr></tbody></table><div style="font-size:12.5px;color:#5b6573;margin:6px 0 0;">Länge, Durchmesser und Systemmaß entsprechen den Maßen der jeweiligen Original-Rohre; geringe Fertigungstoleranzen sind möglich.</div><h2 style="font-size:19px;margin:26px 0 10px;padding:0 0 6px;border-bottom:2px solid #e3e7ec;color:#1d2430;">So prüfst du die Passform</h2><div style="margin:0 0 8px;"><span style="display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;background:#1f4f8f;color:#fff;border-radius:50%;font-weight:bold;font-size:13px;margin-right:9px;">1</span>Miss am vorhandenen Regal den Abstand von Kugelmitte zu Kugelmitte.</div><div style="margin:0 0 8px;"><span style="display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;background:#1f4f8f;color:#fff;border-radius:50%;font-weight:bold;font-size:13px;margin-right:9px;">2</span>Wähle die passende Länge: 350, 500 oder 750 mm Systemmaß.</div><div style="margin:0 0 8px;"><span style="display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;background:#1f4f8f;color:#fff;border-radius:50%;font-weight:bold;font-size:13px;margin-right:9px;">3</span>Vergleiche den Rohrdurchmesser (19 mm) mit deinen vorhandenen Rohren.</div><div style="margin:0 0 8px;"><span style="display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;background:#1f4f8f;color:#fff;border-radius:50%;font-weight:bold;font-size:13px;margin-right:9px;">4</span>Setze Kugeln und Konnektoren vorsichtig ein.</div><h2 style="font-size:19px;margin:26px 0 10px;padding:0 0 6px;border-bottom:2px solid #e3e7ec;color:#1d2430;">Lieferumfang</h2><div style="display:flex;flex-wrap:wrap;gap:12px;"><div style="flex:1 1 240px;box-sizing:border-box;border:1px solid #e3e7ec;border-radius:10px;padding:12px 14px;"><div style="font-weight:bold;margin:0 0 8px;">Enthalten</div><div style="margin:0 0 5px;"><b style="color:#1b7f4b;">✓</b> 1 Rohr in der gewählten Länge</div></div><div style="flex:1 1 240px;box-sizing:border-box;border:1px solid #e3e7ec;border-radius:10px;padding:12px 14px;"><div style="font-weight:bold;margin:0 0 8px;">Nicht enthalten</div><div style="margin:0 0 5px;"><b style="color:#a33a3a;">✗</b> Kugeln</div><div style="margin:0 0 5px;"><b style="color:#a33a3a;">✗</b> Konnektoren</div><div style="margin:0 0 5px;"><b style="color:#a33a3a;">✗</b> Füße, Tablare, Türen</div><div style="margin:0 0 5px;"><b style="color:#a33a3a;">✗</b> Werkzeug</div></div></div><h2 style="font-size:19px;margin:26px 0 10px;padding:0 0 6px;border-bottom:2px solid #e3e7ec;color:#1d2430;">Häufige Fragen</h2><div style="margin:0 0 12px;"><div style="font-weight:bold;">Ist das ein Originalteil von USM?</div><div style="color:#5b6573;">Nein. Es ist ein kompatibles Teil eines anderen Herstellers. Bitte vergleiche die Maße vor dem Kauf.</div></div><div style="margin:0 0 12px;"><div style="font-weight:bold;">Passt es zu meinem vorhandenen Regal?</div><div style="color:#5b6573;">Es ist für die Verwendung mit dem USM-Haller-System gedacht. Wegen unterschiedlicher Fertigungstoleranzen können wir eine 100-%ige Passgenauigkeit zu allen Originalteilen nicht zusichern. Bei Fragen schreib uns gern vor dem Kauf.</div></div><div style="margin:0 0 12px;"><div style="font-weight:bold;">Sind Kugeln und Konnektoren dabei?</div><div style="color:#5b6573;">Nein, verkauft wird nur das Rohr. Kugeln und Konnektoren sind nicht Teil dieses Angebots.</div></div><div style="margin:0 0 12px;"><div style="font-weight:bold;">Warum sitzen die Konnektoren manchmal etwas fest?</div><div style="color:#5b6573;">Chromoberflächen können herstellungsbedingt minimale Unebenheiten an den Rohrenden aufweisen. Konnektoren bitte vorsichtig einsetzen; die Funktion wird nicht beeinträchtigt.</div></div><div style="font-size:11.5px;color:#5b6573;margin:22px 0 0;padding-top:10px;border-top:1px solid #e3e7ec;"><b>Gewerblicher Verkäufer.</b> Rechnung mit ausgewiesener MwSt. auf Wunsch. Impressum, Widerrufsbelehrung und AGB findest du in unserem eBay-Shop.<br></div></div>
