<div style="font-family:Arial,Helvetica,sans-serif;color:#222222;font-size:15px;line-height:1.6;max-width:780px;margin:0 auto;padding:0 10px;"><h1 style="font-size:24px;font-weight:bold;margin:0 0 4px;color:#222222;">Chromrohr, kompatibel mit USM Haller</h1><div style="font-size:16px;margin:0 0 6px;">Länge wählbar: <b>35 cm · 50 cm · 75 cm</b></div><div style="font-size:13px;color:#666666;margin:0 0 16px;padding-bottom:12px;border-bottom:2px solid #222222;">Neuware &amp;nbsp;|&amp;nbsp; Versand kostenlos, mit Sendungsverfolgung &amp;nbsp;|&amp;nbsp; 30 Tage Rückgabe</div><p style="font-size:12.5px;color:#666666;margin:0 0 6px;padding:8px 10px;border:1px solid #cfcfcf;"><b style="color:#222222;">Wichtiger Hinweis:</b> Produkt eines Drittherstellers, <b>kein Originalteil</b> von USM Haller. Der genannte Markenname „USM Haller“ ist markenrechtlich geschützt (USM U. Schärer Söhne AG) und dient nur der Angabe der Kompatibilität. Keine Werksvertretung, keine Verbindung zu USM. Originale USM-Haller-Teile erhältst du direkt bei der USM U. Schärer Söhne AG oder bei deren lizenzierten Handelspartnern.</p><h2 style="font-size:13px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;margin:28px 0 8px;padding:0 0 4px;border-bottom:1px solid #cfcfcf;color:#222222;">Welche Länge brauchst du?</h2><table style="border-collapse:collapse;width:100%;font-size:14.5px;"><thead><tr><th style="text-align:left;font-size:12.5px;font-weight:bold;color:#666666;padding:5px 10px 5px 0;border-bottom:1px solid #cfcfcf;width:16%;">Länge</th><th style="text-align:left;font-size:12.5px;font-weight:bold;color:#666666;padding:5px 10px 5px 0;border-bottom:1px solid #cfcfcf;width:20%;">Systemmaß</th><th style="text-align:left;font-size:12.5px;font-weight:bold;color:#666666;padding:5px 10px 5px 0;border-bottom:1px solid #cfcfcf;width:64%;">Typisch für</th></tr></thead><tbody><tr><td style="vertical-align:top;padding:7px 10px 7px 0;border-bottom:1px solid #ececec;font-weight:bold;">35 cm</td><td style="vertical-align:top;padding:7px 10px 7px 0;border-bottom:1px solid #ececec;">350 mm</td><td style="vertical-align:top;padding:7px 10px 7px 0;border-bottom:1px solid #ececec;">Regale mit 35 cm Tiefe oder überall dort, wo 350 mm Systemmaß benötigt werden.</td></tr><tr><td style="vertical-align:top;padding:7px 10px 7px 0;border-bottom:1px solid #ececec;font-weight:bold;">50 cm</td><td style="vertical-align:top;padding:7px 10px 7px 0;border-bottom:1px solid #ececec;">500 mm</td><td style="vertical-align:top;padding:7px 10px 7px 0;border-bottom:1px solid #ececec;">Regale mit 50 cm Tiefe oder überall dort, wo 500 mm Systemmaß benötigt werden.</td></tr><tr><td style="vertical-align:top;padding:7px 10px 7px 0;border-bottom:1px solid #ececec;font-weight:bold;">75 cm</td><td style="vertical-align:top;padding:7px 10px 7px 0;border-bottom:1px solid #ececec;">750 mm</td><td style="vertical-align:top;padding:7px 10px 7px 0;border-bottom:1px solid #ececec;">Elemente mit 75 cm Breite oder überall dort, wo 750 mm Systemmaß benötigt werden.</td></tr></tbody></table><h2 style="font-size:13px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;margin:28px 0 8px;padding:0 0 4px;border-bottom:1px solid #cfcfcf;color:#222222;">Technische Daten</h2><table style="border-collapse:collapse;width:100%;font-size:14.5px;"><tbody><tr><td style="vertical-align:top;padding:6px 14px 6px 0;border-bottom:1px solid #ececec;color:#666666;width:34%;">Material</td><td style="vertical-align:top;padding:6px 0;border-bottom:1px solid #ececec;">Stahl, verchromt</td></tr><tr><td style="vertical-align:top;padding:6px 14px 6px 0;border-bottom:1px solid #ececec;color:#666666;width:34%;">Oberfläche</td><td style="vertical-align:top;padding:6px 0;border-bottom:1px solid #ececec;">Chrom, glänzend</td></tr><tr><td style="vertical-align:top;padding:6px 14px 6px 0;border-bottom:1px solid #ececec;color:#666666;width:34%;">Durchmesser</td><td style="vertical-align:top;padding:6px 0;border-bottom:1px solid #ececec;">19 mm</td></tr><tr><td style="vertical-align:top;padding:6px 14px 6px 0;border-bottom:1px solid #ececec;color:#666666;width:34%;">Zustand</td><td style="vertical-align:top;padding:6px 0;border-bottom:1px solid #ececec;">Neu</td></tr></tbody></table><p style="margin:0 0 8px;font-size:12.5px;color:#666666;margin-top:6px;">Länge, Durchmesser und Systemmaß entsprechen den Maßen der jeweiligen Original-Rohre; geringe Fertigungstoleranzen sind möglich.</p><h2 style="font-size:13px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;margin:28px 0 8px;padding:0 0 4px;border-bottom:1px solid #cfcfcf;color:#222222;">So prüfst du die Passform</h2><ol style="margin:0;padding-left:22px;"><li style="margin:0 0 4px;">Miss am vorhandenen Regal den Abstand von Kugelmitte zu Kugelmitte.</li><li style="margin:0 0 4px;">Wähle die passende Länge: 350, 500 oder 750 mm Systemmaß.</li><li style="margin:0 0 4px;">Vergleiche den Rohrdurchmesser (19 mm) mit deinen vorhandenen Rohren.</li><li style="margin:0 0 4px;">Setze Kugeln und Konnektoren vorsichtig ein.</li></ol><h2 style="font-size:13px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;margin:28px 0 8px;padding:0 0 4px;border-bottom:1px solid #cfcfcf;color:#222222;">Lieferumfang</h2><p style="margin:0 0 8px;"><b>Enthalten:</b> 1 Rohr in der gewählten Länge</p><p style="margin:0 0 8px;"><b>Nicht enthalten:</b> Kugeln, Konnektoren, Füße, Tablare, Türen, Werkzeug</p><h2 style="font-size:13px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;margin:28px 0 8px;padding:0 0 4px;border-bottom:1px solid #cfcfcf;color:#222222;">Häufige Fragen</h2><p style="margin:0 0 10px;"><b>Ist das ein Originalteil von USM?</b><br>Nein. Es ist ein kompatibles Teil eines anderen Herstellers. Bitte vergleiche die Maße vor dem Kauf.</p><p style="margin:0 0 10px;"><b>Passt es zu meinem vorhandenen Regal?</b><br>Es ist für die Verwendung mit dem USM-Haller-System gedacht. Wegen unterschiedlicher Fertigungstoleranzen können wir eine 100-%ige Passgenauigkeit zu allen Originalteilen nicht zusichern. Bei Fragen schreib uns gern vor dem Kauf.</p><p style="margin:0 0 10px;"><b>Sind Kugeln und Konnektoren dabei?</b><br>Nein, verkauft wird nur das Rohr. Kugeln und Konnektoren sind nicht Teil dieses Angebots.</p><p style="margin:0 0 10px;"><b>Warum sitzen die Konnektoren manchmal etwas fest?</b><br>Chromoberflächen können herstellungsbedingt minimale Unebenheiten an den Rohrenden aufweisen. Konnektoren bitte vorsichtig einsetzen; die Funktion wird nicht beeinträchtigt.</p><p style="font-size:11.5px;color:#666666;margin:24px 0 0;padding-top:8px;border-top:1px solid #cfcfcf;"><b>Gewerblicher Verkäufer.</b> Rechnung mit ausgewiesener MwSt. auf Wunsch. Impressum, Widerrufsbelehrung und AGB findest du in unserem eBay-Shop.</p></div>
