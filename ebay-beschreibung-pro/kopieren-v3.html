inimale Unebenheiten an den Rohrenden aufweisen. Konnektoren bitte vorsichtig einsetzen; die Funktion wird nicht beeinträchtigt.</div></div><div style="font-size:11.5px;color:#667180;margin:26px 0 0;padding-top:9px;border-top:1px solid #d5dbe1;"><b>Gewerblicher Verkäufer.</b> Rechnung mit ausgewiesener MwSt. auf Wunsch. Impressum, Widerrufsbelehrung und AGB findest du in unserem eBay-Shop.</div></div>
