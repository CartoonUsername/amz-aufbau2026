<head>
<meta charset="utf-8">

<title>eBay-Beschreibung zum Kopieren</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; max-width: 960px; margin: 24px auto; padding: 0 16px; background: #fff; color: #222; }
  h1 { font-size: 22px; }

</style>
</head>
<body>

<h1>eBay-Beschreibung: Chromrohre kompatibel mit USM Haller</h1>
<p class="note">Vor dem Einfügen alle Stellen mit <strong>[PRÜFEN]</strong> bzw. <strong>[CHECK]</strong> durch eure echten Daten ersetzen. In eBay unter „Beschreibung“ den Editor auf <strong>HTML</strong> stellen und den Code einfügen.</p>

<h2>Beschreibung Deutsch + English (ein Block)</h2>
<textarea id="all" readonly><!-- ======== DEUTSCH ======== -->
<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.4;max-width:800px">

<p style="margin:0 0 8px"><strong>Varianten:</strong> 35 cm (Systemmaß 350 mm) · 50 cm (Systemmaß 500 mm) · 75 cm (Systemmaß 750 mm)<br>
<strong>Daten:</strong> Stahl, verchromt [PRÜFEN] · Ø 19 mm [PRÜFEN] · Wandstärke [PRÜFEN] mm · Zustand: Neu<br>
<strong>Tatsächliche Länge:</strong> 35 cm = [PRÜFEN] mm, 50 cm = [PRÜFEN] mm, 75 cm = [PRÜFEN] mm (Systemmaß = Kugelabstand, daher etwas kürzer; Toleranz wenige mm)<br>
<strong>Lieferumfang:</strong> 1 Rohr in gewählter Länge (ohne Kugeln, Konnektoren, Füße, Tablare)</p>
<p style="margin:0 0 8px"><strong>Passform:</strong> Für die Verwendung mit dem USM-Haller-System gedacht. Eine 100-%ige Passgenauigkeit zu allen Originalteilen können wir wegen unterschiedlicher Fertigungstoleranzen nicht zusichern – bitte Maße vorab vergleichen. Chrom kann an den Rohrenden minimale Unebenheiten aufweisen; Konnektoren daher vorsichtig einsetzen.</p>
<p style="margin:0;font-size:12px"><strong>Hersteller / Verantwortliche Person (EU):</strong> [FIRMA, ANSCHRIFT, E-MAIL – PRÜFEN]. Nicht für Kinder unter 3 Jahren (Kleinteile bei Zubehör). Rohrenden können scharfkantig sein.</p>
</div>

<hr>
<!-- ======== ENGLISH ======== -->
<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.4;max-width:800px">
<p style="font-size:16px;margin:0 0 6px"><strong>Chrome tube, compatible with USM Haller – choose 35, 50 or 75 cm</strong></p>
<p style="margin:0 0 8px"><strong>Notice:</strong> Compatible replacement part, <strong>not an original part</strong> by USM U. Schärer Söhne AG. “USM” and “USM Haller” are registered trademarks of USM U. Schärer Söhne AG; we are not affiliated with USM. Names are used only to indicate compatibility.</p>
<p style="margin:0 0 8px"><strong>Variations:</strong> 35 cm (system size 350 mm) · 50 cm (system size 500 mm) · 75 cm (system size 750 mm)<br>
<strong>Specs:</strong> chrome-plated steel [CHECK] · Ø 19 mm [CHECK] · wall thickness [CHECK] mm · Condition: New<br>
<strong>Actual length:</strong> 35 cm = [CHECK] mm, 50 cm = [CHECK] mm, 75 cm = [CHECK] mm (system size = ball distance, so slightly shorter; tolerance a few mm)<br>
<strong>Included:</strong> 1 tube in the selected length (no balls, connectors, feet, shelves)</p>
<p style="margin:0 0 8px"><strong>Fit:</strong> Intended for use with the USM Haller system. Due to differing manufacturing tolerances we cannot guarantee a 100% fit with all original parts – please compare measurements beforehand. The chrome may show minor irregularities at the tube ends; insert connectors carefully.</p>
<p style="margin:0;font-size:12px"><strong>Manufacturer / responsible person (EU):</strong> [COMPANY, ADDRESS, EMAIL – CHECK]. Not suitable for children under 3 years (small parts in accessories). Tube ends may be sharp.</p>
</div></textarea>
<button onclick="copyAll()">Alles kopieren</button><span class="ok" id="ok-all"></span>

<script>
function copyAll() {
  var text = document.getElementById("all").value;
  var done = function () {
    var el = document.getElementById("ok-all");
    el.textContent = "Kopiert!";
    setTimeout(function () { el.textContent = ""; }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done);
  } else {
    var t = document.getElementById("all"); t.select(); document.execCommand("copy"); done();
  }
}
</script>
</body>
</html>
